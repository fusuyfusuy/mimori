name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  determinism-and-self-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - name: byte-identical skill mirror gate
        run: cmp -s SKILL.md skills/mimori/SKILL.md
      - name: byte-identical cold-vs-warm markdown and JSON determinism gate
        run: |
          set -euo pipefail
          for cmd in \
            "map" \
            "map --json" \
            "find SymbolGraph --json" \
            "slice src/graph/mod.rs:SymbolGraph::new --json" \
            "blast src/model/coordinate.rs:Coordinate::parse -d 2 --json" \
            "dump --budget 1500 --json" \
            "doctor --json"
          do
            ./target/debug/mimori clean >/dev/null 2>&1 || true
            ./target/debug/mimori $cmd > /tmp/det_cold.out
            ./target/debug/mimori $cmd > /tmp/det_warm.out
            diff -u /tmp/det_cold.out /tmp/det_warm.out
          done
          echo "determinism gate: all cold/warm markdown and JSON outputs byte-identical"
      - name: self-hosted memory lint and debt check
        run: |
          ./target/debug/mimori memory lint
          ./target/debug/mimori debt check
