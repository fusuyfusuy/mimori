name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify zero external dependencies & syntax
        run: |
          python -m py_compile mimori

      - name: Run mimori self-test suite
        run: |
          python mimori --test

      - name: Run mimori integration & concurrency test suite
        run: |
          python test_mimori.py

      - name: Test installer script syntax
        run: |
          bash -n install.sh
